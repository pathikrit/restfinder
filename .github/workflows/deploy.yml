name: Test and deploy

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 6 1 * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: restfinder
          POSTGRES_PASSWORD: restfinder
          POSTGRES_DB: restfinder_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U restfinder -d restfinder_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://restfinder:restfinder@localhost:5432/restfinder_test
      TEST_DATABASE_URL: postgresql://restfinder:restfinder@localhost:5432/restfinder_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.9.26"
          enable-cache: true
      - run: uv sync --locked
      - run: make test

  deploy:
    if: github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      NYC_OPEN_DATA_APP_TOKEN: ${{ secrets.NYC_OPEN_DATA_APP_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.9.26"
          enable-cache: true
      - run: uv sync --locked
      - if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: make fetch
      - run: make build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .site
      - id: deployment
        uses: actions/deploy-pages@v4
