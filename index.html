<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#111827">
  <meta name="color-scheme" content="dark light">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="RestFinder">
  <title>Rick's Restaurant Finder</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="assets/icons/app-icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">
  <script>
    (() => {
      let theme = 'dark';
      try {
        const saved = localStorage.getItem('restfinder-theme');
        theme = saved === 'light' || saved === 'dark'
          ? saved
          : (window.matchMedia?.('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
      } catch (_) {}
      document.documentElement.dataset.theme = theme;
    })();
  </script>
  <link rel="stylesheet" href="assets/app.css?v=11">
</head>
<body>
  <header>
    <h1>Rick's Restaurant Finder</h1>
    <div id="address-search" class="address-search" aria-label="Search for an address in the NYC metro area">
      <div id="autocomplete-host" class="autocomplete-host"><span class="search-placeholder">Loading address search…</span></div>
      <button id="locate-me" class="locate-button" type="button" aria-label="Use my current location" title="Use my current location"><i class="fa-solid fa-location-crosshairs" aria-hidden="true"></i></button>
      <span id="address-search-status" class="sr-only" aria-live="polite"></span>
    </div>
    <div class="header-meta">
      <button id="theme-toggle" class="theme-toggle" type="button" aria-label="Switch color theme" title="Switch color theme"><i class="fa-solid fa-sun" aria-hidden="true"></i></button>
      <span id="version" class="version">Loading…</span>
    </div>
  </header>
  <section class="map-shell">
    <main id="map" aria-label="Restaurant map"><div class="map-message">Loading map…</div></main>
    <aside id="details" class="details" aria-label="Restaurant details" hidden></aside>
    <nav class="legal" aria-label="Legal and attribution">
      <span>Enrichment: <a href="https://overturemaps.org" target="_blank" rel="noopener">Overture Maps</a></span>
      <a href="privacy.html">Privacy</a><a href="terms.html">Terms</a>
    </nav>
  </section>
  <section id="table-wrap" aria-live="polite"><div class="empty">Loading restaurants…</div></section>
  <script type="module" src="assets/app.js?v=11"></script>
</body>
</html>
