<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#111827">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="RestFinder">
  <title>Rick's Restaurant Finder</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="assets/icons/app-icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">
  <style>
    :root {
      color-scheme: dark;
      --bg: #0b1120;
      --panel: #111827;
      --panel-soft: #1f2937;
      --line: #334155;
      --text: #e5e7eb;
      --muted: #94a3b8;
      --accent: #f59e0b;
      --blue: #60a5fa;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; background: var(--bg); color: var(--text); font: 14px/1.4 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    body { display: grid; min-height: 100dvh; grid-template-rows: auto minmax(260px, 55dvh) 1fr; overflow: hidden; }
    header { position: relative; z-index: 1001; display: grid; grid-template-columns: minmax(max-content, 1fr) minmax(280px, 600px) minmax(max-content, 1fr); align-items: center; gap: 18px; min-height: 48px; padding: max(8px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) 8px max(16px, env(safe-area-inset-left)); border-bottom: 1px solid var(--line); background: var(--panel); }
    h1 { margin: 0; font-size: 16px; letter-spacing: .01em; }
    .status { color: var(--muted); font-size: 12px; text-align: right; }
    .status a { color: var(--muted); text-underline-offset: 2px; }
    .status a:hover { color: var(--text); }
    .address-search { position: relative; width: 100%; }
    .address-search-control { position: relative; display: flex; align-items: center; }
    .address-search-icon { position: absolute; left: 11px; color: var(--muted); font-size: 12px; pointer-events: none; }
    .address-search input {
      width: 100%;
      height: 34px;
      padding: 6px 38px 6px 34px;
      border: 1px solid var(--line);
      border-radius: 8px;
      outline: none;
      background: var(--bg);
      color: var(--text);
      font: inherit;
    }
    .address-search input::placeholder { color: var(--muted); }
    .address-search input:focus { border-color: var(--blue); box-shadow: 0 0 0 2px rgba(96,165,250,.12); }
    .locate-button {
      position: absolute;
      right: 4px;
      display: grid;
      width: 28px;
      height: 26px;
      padding: 0;
      place-items: center;
      border: 0;
      border-radius: 5px;
      background: transparent;
      color: var(--blue);
      cursor: pointer;
    }
    .locate-button:hover, .locate-button:focus-visible { background: rgba(96,165,250,.14); outline: none; }
    .locate-button:disabled { color: var(--muted); cursor: wait; }
    .address-results {
      position: absolute;
      top: calc(100% + 5px);
      right: 0;
      left: 0;
      z-index: 1100;
      max-height: min(360px, 55vh);
      margin: 0;
      padding: 5px;
      overflow-y: auto;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
      box-shadow: 0 12px 28px rgba(0,0,0,.45);
      list-style: none;
    }
    .address-results[hidden] { display: none; }
    .address-result button {
      display: grid;
      grid-template-columns: 24px minmax(0, 1fr);
      gap: 7px;
      width: 100%;
      padding: 8px;
      border: 0;
      border-radius: 5px;
      background: transparent;
      color: var(--text);
      font: inherit;
      text-align: left;
      cursor: pointer;
    }
    .address-result button:hover, .address-result[aria-selected="true"] button { background: var(--panel-soft); }
    .address-result i { padding-top: 3px; color: var(--blue); text-align: center; }
    .address-result-label { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .search-credit { padding: 5px 8px 3px; color: var(--muted); font-size: 10px; text-align: right; }
    .search-credit a { color: var(--muted); }
    .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0; }
    #map { width: 100%; height: 100%; }
    #table-wrap { overflow: auto; overscroll-behavior: contain; border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom); }
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    thead { position: sticky; top: 0; z-index: 2; background: var(--panel); }
    th { padding: 8px 10px; border-bottom: 2px solid var(--line); color: var(--muted); text-align: left; vertical-align: top; }
    th:first-child, td:first-child { width: 44px; }
    th:nth-child(2), td:nth-child(2) { width: 34%; }
    td { max-width: 480px; padding: 8px 10px; border-bottom: 1px solid #1e293b; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    tbody tr { cursor: pointer; }
    tbody tr:hover, tbody tr.selected { background: var(--panel-soft); }
    a { color: var(--blue); }
    .reference { color: var(--accent); }
    .restaurant-name { color: var(--text); font-weight: 600; }
    .map-link {
      display: inline-grid;
      width: 22px;
      height: 22px;
      margin-left: 5px;
      place-items: center;
      border-radius: 5px;
      color: var(--blue);
      font-size: 10px;
      text-decoration: none;
      vertical-align: -1px;
    }
    .map-link:hover, .map-link:focus-visible { background: rgba(96,165,250,.14); color: #93c5fd; outline: none; }
    .filter { position: relative; margin-top: 5px; }
    .filter input { width: 100%; min-width: 90px; padding: 5px 7px; border: 1px solid var(--line); border-radius: 5px; outline: none; background: var(--bg); color: var(--text); font: inherit; font-size: 11px; }
    .filter input:focus { border-color: var(--blue); }
    .empty { display: grid; min-height: 160px; place-items: center; padding: 24px; color: var(--muted); text-align: center; }
    .pin-label { padding: 2px 6px; border: 1px solid var(--line); border-radius: 4px; background: rgba(11,17,32,.9); color: var(--text); font-weight: 650; }
    .map-pin-marker { background: transparent; border: 0; }
    .map-pin {
      position: absolute;
      top: 3px;
      left: 4px;
      width: 27px;
      height: 27px;
      transform: rotate(-45deg);
      border: 2px solid #fff;
      border-radius: 50% 50% 50% 0;
      background: var(--pin-color);
      box-shadow: 0 2px 5px rgba(0,0,0,.65);
    }
    .map-pin img {
      position: absolute;
      top: 5px;
      left: 5px;
      width: 15px;
      height: 15px;
      transform: rotate(45deg);
      filter: brightness(0) invert(1);
    }
    .popup-heading { display: flex; align-items: center; margin-bottom: 8px; font-size: 14px; }
    .popup-heading .map-link { color: #2563eb; }
    .popup-metadata { display: grid; gap: 7px; }
    .metadata-row { display: grid; grid-template-columns: 20px minmax(0, 1fr); align-items: start; gap: 7px; }
    .metadata-icon {
      display: grid;
      width: 20px;
      height: 20px;
      place-items: center;
      border-radius: 50%;
      background: #dbeafe;
      color: #2563eb;
      font-size: 10px;
    }
    .metadata-row:nth-child(even) .metadata-icon { background: #fef3c7; color: #d97706; }
    .metadata-value { min-width: 0; padding-top: 1px; }
    .metadata-value a { overflow-wrap: anywhere; }
    @media (max-width: 700px) {
      body { grid-template-rows: auto minmax(220px, 42dvh) minmax(0, 1fr); }
      header { grid-template-columns: minmax(0, 1fr) max-content; gap: 7px 10px; padding: max(8px, env(safe-area-inset-top)) max(10px, env(safe-area-inset-right)) 8px max(10px, env(safe-area-inset-left)); }
      h1 { font-size: 14px; }
      .status { font-size: 10px; }
      .address-search { grid-column: 1 / -1; grid-row: 2; }
      .address-search input, .filter input { font-size: 16px; }
      .address-search input { height: 42px; padding-right: 48px; }
      .locate-button { width: 36px; height: 34px; font-size: 14px; }
      .leaflet-touch .leaflet-bar a { width: 38px; height: 38px; line-height: 38px; }
      table, thead, tbody { display: block; width: 100%; }
      thead tr { display: grid; grid-template-columns: 1fr 1fr; gap: 7px; padding: 8px 10px; }
      th { width: auto !important; padding: 0; border: 0; }
      th:first-child { display: none; }
      th:nth-child(4) { grid-column: 1 / -1; }
      tbody tr { display: grid; grid-template-columns: 28px minmax(0, 1fr); gap: 3px 8px; padding: 10px; border-bottom: 1px solid #1e293b; }
      td { width: auto !important; max-width: none; padding: 0; overflow: visible; border: 0; white-space: normal; }
      td:first-child { grid-row: 1 / 4; color: var(--muted); font-size: 11px; }
      td:nth-child(2) { font-size: 15px; }
      td:nth-child(3) { color: var(--muted); font-size: 12px; }
      td:nth-child(3)::before { content: "Type · "; }
      td:nth-child(4) { font-size: 13px; }
      .map-link { width: 36px; height: 36px; margin-top: -7px; margin-bottom: -7px; font-size: 12px; }
    }
  </style>
</head>
<body>
  <header>
    <h1>Rick's Restaurant Finder</h1>
    <form id="address-search" class="address-search" role="search" autocomplete="off">
      <label class="sr-only" for="address-query">Search for an address in the NYC metro area</label>
      <div class="address-search-control">
        <i class="fa-solid fa-magnifying-glass address-search-icon" aria-hidden="true"></i>
        <input id="address-query" type="search" inputmode="search" placeholder="Search an NYC metro address…" aria-autocomplete="list" aria-controls="address-results" aria-expanded="false">
        <button id="locate-me" class="locate-button" type="button" aria-label="Use my current location" title="Use my current location"><i class="fa-solid fa-location-crosshairs" aria-hidden="true"></i></button>
      </div>
      <ul id="address-results" class="address-results" role="listbox" hidden></ul>
      <span id="address-search-status" class="sr-only" aria-live="polite"></span>
    </form>
    <span id="status" class="status">Loading…</span>
  </header>
  <main id="map" aria-label="Restaurant map"></main>
  <section id="table-wrap" aria-live="polite"><div class="empty">Loading restaurants…</div></section>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
  <script>
    const filters = { name: '', type: '', references: '' };
    const markers = new Map();
    let restaurants = [];
    let addressResults = [];
    let activeAddressIndex = -1;
    let addressSearchTimer;
    let addressSearchController;

    const typeColor = {
      'Restaurant': '#dc2626',
      'Bars': '#7c3aed',
      'Coffee Shops': '#92400e',
      'Dessert': '#db2777',
      'Fast Food': '#ea580c',
      'Hidden / Speakeasy': '#111827'
    };

    const typeIcon = {
      'Restaurant': 'restaurant',
      'Bars': 'bar',
      'Coffee Shops': 'cafe',
      'Dessert': 'ice-cream',
      'Fast Food': 'fast-food',
      'Hidden / Speakeasy': 'danger'
    };

    const map = L.map('map').setView([40.758, -73.9855], 12);
    map.attributionControl.setPrefix('<a href="https://leafletjs.com" target="_blank" rel="noopener">Leaflet</a>');
    L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', {
      minZoom: 0,
      maxZoom: 20,
      subdomains: 'abcd',
      attribution: '&copy; <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a> contributors &copy; <a href="https://carto.com/attributions" target="_blank" rel="noopener">CARTO</a>'
    }).addTo(map);
    const markerLayer = L.layerGroup().addTo(map);
    const addressLayer = L.layerGroup().addTo(map);

    const addressForm = document.getElementById('address-search');
    const addressInput = document.getElementById('address-query');
    const addressResultsList = document.getElementById('address-results');
    const addressSearchStatus = document.getElementById('address-search-status');
    const locateButton = document.getElementById('locate-me');
    const metroBounds = '-74.50,40.40,-73.20,41.20';
    const detailZoom = 18;

    function addressLabel(feature) {
      const properties = feature.properties || {};
      const streetAddress = [properties.housenumber, properties.street].filter(Boolean).join(' ');
      const parts = [streetAddress || properties.name, properties.city || properties.locality || properties.county, properties.state, properties.postcode];
      return parts.filter((part, index) => part && parts.indexOf(part) === index).join(', ');
    }

    function hideAddressResults() {
      addressResultsList.hidden = true;
      addressInput.setAttribute('aria-expanded', 'false');
      activeAddressIndex = -1;
    }

    function renderAddressResults() {
      if (!addressResults.length) {
        hideAddressResults();
        return;
      }
      addressResultsList.innerHTML = addressResults.map((feature, index) => `
        <li class="address-result" role="option" aria-selected="${index === activeAddressIndex}" data-index="${index}">
          <button type="button" tabindex="-1" data-index="${index}">
            <i class="fa-solid fa-location-dot" aria-hidden="true"></i>
            <span class="address-result-label">${escapeHtml(addressLabel(feature))}</span>
          </button>
        </li>`).join('') + `
        <li class="search-credit" role="presentation">Search by <a href="https://photon.komoot.io" target="_blank" rel="noopener">Photon</a> · <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a></li>`;
      addressResultsList.hidden = false;
      addressInput.setAttribute('aria-expanded', 'true');
    }

    async function searchAddresses(query) {
      if (addressSearchController) addressSearchController.abort();
      addressSearchController = new AbortController();
      const center = map.getCenter();
      const parameters = new URLSearchParams({
        q: query,
        limit: '10',
        lang: 'en',
        bbox: metroBounds,
        lat: String(center.lat),
        lon: String(center.lng),
        zoom: String(map.getZoom())
      });
      addressSearchStatus.textContent = 'Searching addresses…';
      try {
        const response = await fetch(`https://photon.komoot.io/api/?${parameters}`, {
          signal: addressSearchController.signal
        });
        if (!response.ok) throw new Error('Address search failed');
        const payload = await response.json();
        const labels = new Set();
        addressResults = (payload.features || []).filter(feature => {
          if (!Array.isArray(feature.geometry?.coordinates) || feature.geometry.coordinates.length < 2) return false;
          const label = addressLabel(feature);
          if (!label || labels.has(label)) return false;
          labels.add(label);
          return true;
        }).slice(0, 6);
        activeAddressIndex = -1;
        renderAddressResults();
        addressSearchStatus.textContent = addressResults.length ? `${addressResults.length} address suggestions available.` : 'No matching addresses found.';
        return addressResults;
      } catch (error) {
        if (error.name === 'AbortError') return [];
        addressResults = [];
        hideAddressResults();
        addressSearchStatus.textContent = 'Address search is temporarily unavailable.';
        return [];
      }
    }

    function selectAddress(index) {
      const feature = addressResults[index];
      if (!feature) return;
      const [lon, lat] = feature.geometry.coordinates;
      const label = addressLabel(feature);
      addressInput.value = label;
      hideAddressResults();
      addressLayer.clearLayers();
      L.circleMarker([lat, lon], {
        radius: 8,
        color: '#e5e7eb',
        weight: 3,
        fillColor: '#3b82f6',
        fillOpacity: 1
      }).bindTooltip(label, { direction: 'top' }).addTo(addressLayer);
      map.flyTo([lat, lon], detailZoom, { duration: .7 });
      addressSearchStatus.textContent = `Map centered on ${label}.`;
    }

    function finishLocationRequest() {
      locateButton.disabled = false;
      locateButton.querySelector('i').className = 'fa-solid fa-location-crosshairs';
    }

    locateButton.addEventListener('click', () => {
      if (!navigator.geolocation) {
        addressSearchStatus.textContent = 'Location services are not supported by this browser.';
        return;
      }
      locateButton.disabled = true;
      locateButton.querySelector('i').className = 'fa-solid fa-spinner fa-spin';
      addressSearchStatus.textContent = 'Finding your current location…';
      navigator.geolocation.getCurrentPosition(position => {
        const { latitude, longitude, accuracy } = position.coords;
        addressInput.value = 'Current location';
        hideAddressResults();
        addressLayer.clearLayers();
        L.circle([latitude, longitude], {
          radius: accuracy,
          color: '#60a5fa',
          weight: 1,
          fillColor: '#60a5fa',
          fillOpacity: .1,
          interactive: false
        }).addTo(addressLayer);
        L.circleMarker([latitude, longitude], {
          radius: 8,
          color: '#e5e7eb',
          weight: 3,
          fillColor: '#3b82f6',
          fillOpacity: 1
        }).bindTooltip('Your current location', { direction: 'top' }).addTo(addressLayer);
        map.flyTo([latitude, longitude], detailZoom, { duration: .7 });
        addressSearchStatus.textContent = 'Map centered on your current location.';
        finishLocationRequest();
      }, error => {
        const messages = {
          1: 'Location permission was denied.',
          2: 'Your current location is unavailable.',
          3: 'Finding your location timed out.'
        };
        addressSearchStatus.textContent = messages[error.code] || 'Could not determine your current location.';
        finishLocationRequest();
      }, {
        enableHighAccuracy: true,
        timeout: 10000,
        maximumAge: 60000
      });
    });

    addressInput.addEventListener('input', () => {
      clearTimeout(addressSearchTimer);
      const query = addressInput.value.trim();
      if (query.length < 3) {
        if (addressSearchController) addressSearchController.abort();
        addressResults = [];
        hideAddressResults();
        return;
      }
      addressSearchTimer = setTimeout(() => searchAddresses(query), 300);
    });

    addressInput.addEventListener('keydown', event => {
      if (event.key === 'Enter') {
        event.preventDefault();
        addressForm.requestSubmit();
        return;
      }
      if (event.key === 'Escape') {
        hideAddressResults();
        return;
      }
      if (!addressResults.length || !['ArrowDown', 'ArrowUp'].includes(event.key)) return;
      event.preventDefault();
      const direction = event.key === 'ArrowDown' ? 1 : -1;
      activeAddressIndex = (activeAddressIndex + direction + addressResults.length) % addressResults.length;
      renderAddressResults();
      addressResultsList.querySelector(`[data-index="${activeAddressIndex}"]`)?.scrollIntoView({ block: 'nearest' });
    });

    addressForm.addEventListener('submit', async event => {
      event.preventDefault();
      clearTimeout(addressSearchTimer);
      if (activeAddressIndex >= 0) {
        selectAddress(activeAddressIndex);
        return;
      }
      const query = addressInput.value.trim();
      if (query.length < 3) return;
      const results = await searchAddresses(query);
      if (results.length) selectAddress(0);
    });

    addressResultsList.addEventListener('mousedown', event => event.preventDefault());
    addressResultsList.addEventListener('click', event => {
      const button = event.target.closest('button[data-index]');
      if (button) selectAddress(Number(button.dataset.index));
    });
    document.addEventListener('click', event => {
      if (!addressForm.contains(event.target)) hideAddressResults();
    });

    function iconFor(type) {
      const icon = typeIcon[type] || typeIcon.Restaurant;
      const color = typeColor[type] || typeColor.Restaurant;
      return L.divIcon({
        html: `<span class="map-pin" style="--pin-color:${color}" aria-hidden="true"><img src="assets/maki/${icon}.svg" alt=""></span>`,
        className: 'map-pin-marker',
        iconSize: [35, 42],
        iconAnchor: [17, 39],
        popupAnchor: [0, -36]
      });
    }

    function escapeHtml(value) {
      return String(value == null ? '' : value).replace(/[&<>"']/g, character => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;'
      })[character]);
    }

    function referenceHtml(item) {
      const value = item.reference || '';
      try {
        const url = new URL(value);
        if (url.protocol === 'http:' || url.protocol === 'https:') {
          const hostname = url.hostname.replace(/^www\./, '').replace(/^archive\./, '').replace(/^web\./, '');
          const labels = {
            'guide.michelin.com': 'Michelin',
            'jamesbeard.org': 'James Beard',
            'ny.itsfound.com': 'Itsfound',
            'atlasobscura.com': 'Atlas Obscura',
            'theinfatuation.com': 'Infatuation'
          };
          const label = labels[hostname] || hostname;
          return `<a class="reference" href="${escapeHtml(url.href)}" target="_blank" rel="noopener">${escapeHtml(label)}</a>`;
        }
      } catch (_) {}
      return `<span class="reference">${escapeHtml(value)}</span>`;
    }

    function referencesHtml(items) {
      return (items || []).map(referenceHtml).join(', ');
    }

    function googleMapsUrl(restaurant) {
      const location = restaurant.address || `${restaurant.lat},${restaurant.lon}`;
      const query = encodeURIComponent(`${restaurant.name} @ ${location}`);
      return `https://www.google.com/maps/search/?api=1&query=${query}`;
    }

    function referenceSearchText(restaurant) {
      return (restaurant.references || []).map(item => item.reference || '').join(' ').toLowerCase();
    }

    function filteredRestaurants() {
      if (!restaurants.length) return [];
      const bounds = map.getBounds();
      return restaurants.filter(restaurant =>
        bounds.contains([restaurant.lat, restaurant.lon]) &&
        (!filters.name || (restaurant.name || '').toLowerCase().includes(filters.name)) &&
        (!filters.type || (restaurant.type || 'unclassified').toLowerCase().includes(filters.type)) &&
        (!filters.references || referenceSearchText(restaurant).includes(filters.references))
      );
    }

    function filterInput(key) {
      return `<div class="filter"><input data-filter="${key}" value="${escapeHtml(filters[key])}" placeholder="Filter…" aria-label="Filter ${key}"></div>`;
    }

    function selectRestaurant(id) {
      document.querySelectorAll('tbody tr').forEach(row => row.classList.toggle('selected', row.dataset.id === id));
      const marker = markers.get(id);
      if (marker) {
        map.flyTo(marker.getLatLng(), detailZoom, { duration: .7 });
        marker.openPopup();
      }
    }

    function render() {
      const visible = filteredRestaurants();
      markerLayer.clearLayers();
      markers.clear();

      visible.forEach(restaurant => {
        const address = restaurant.address || '';
        const mapUrl = googleMapsUrl(restaurant);
        const metadata = [
          ['fa-utensils', escapeHtml(restaurant.type || 'Unclassified')],
          restaurant.cuisine ? ['fa-bowl-food', escapeHtml(restaurant.cuisine)] : null,
          ['fa-location-dot', escapeHtml(address || `${restaurant.lat}, ${restaurant.lon}`)],
          restaurant.phone ? ['fa-phone', `<a href="tel:${escapeHtml(restaurant.phone)}">${escapeHtml(restaurant.phone)}</a>`] : null,
          restaurant.references.length ? ['fa-bookmark', referencesHtml(restaurant.references)] : null
        ].filter(Boolean).map(([icon, value]) => `
          <div class="metadata-row">
            <span class="metadata-icon" aria-hidden="true"><i class="fa-solid ${icon}"></i></span>
            <span class="metadata-value">${value}</span>
          </div>`).join('');
        const popup = `
          <div class="popup-heading">
            <strong>${escapeHtml(restaurant.name)}</strong>
            <a class="map-link" href="${mapUrl}" target="_blank" rel="noopener" aria-label="Open ${escapeHtml(restaurant.name)} in Google Maps" title="Open in Google Maps">
              <i class="fa-solid fa-arrow-up-right-from-square" aria-hidden="true"></i>
            </a>
          </div>
          <div class="popup-metadata">${metadata}</div>`;
        const markerType = restaurant.type || 'Unclassified';
        const marker = L.marker([restaurant.lat, restaurant.lon], {
          icon: iconFor(restaurant.type),
          title: `${markerType}: ${restaurant.name}`,
          alt: `${markerType}: ${restaurant.name}`,
          riseOnHover: true
        }).bindPopup(popup);
        if (visible.length <= 10) marker.bindTooltip(restaurant.name, { permanent: true, direction: 'top', className: 'pin-label' });
        marker.addTo(markerLayer);
        markers.set(restaurant.id, marker);
      });

      const wrap = document.getElementById('table-wrap');
      if (!restaurants.length) {
        wrap.innerHTML = '<div class="empty">No referenced restaurants have been published yet.</div>';
        return;
      }
      let html = `<table><thead><tr>
        <th>#</th>
        <th>Name${filterInput('name')}</th>
        <th>Type${filterInput('type')}</th>
        <th>Mentions${filterInput('references')}</th>
      </tr></thead><tbody>`;
      visible.forEach((restaurant, index) => {
        const mapUrl = googleMapsUrl(restaurant);
        html += `<tr data-id="${escapeHtml(restaurant.id)}">
          <td>${index + 1}</td>
          <td title="${escapeHtml(restaurant.name)}">
            <span class="restaurant-name">${escapeHtml(restaurant.name)}</span>
            <a class="map-link" href="${mapUrl}" target="_blank" rel="noopener" aria-label="Open ${escapeHtml(restaurant.name)} in Google Maps" title="Open in Google Maps">
              <i class="fa-solid fa-arrow-up-right-from-square" aria-hidden="true"></i>
            </a>
          </td>
          <td title="${escapeHtml(restaurant.type || 'Unclassified')}">${escapeHtml(restaurant.type || 'Unclassified')}</td>
          <td>${referencesHtml(restaurant.references)}</td>
        </tr>`;
      });
      wrap.innerHTML = `${html}</tbody></table>`;
      wrap.querySelectorAll('input[data-filter]').forEach(input => {
        input.addEventListener('input', event => {
          filters[event.target.dataset.filter] = event.target.value.trim().toLowerCase();
          render();
          const replacement = document.querySelector(`input[data-filter="${event.target.dataset.filter}"]`);
          replacement.focus();
          replacement.setSelectionRange(replacement.value.length, replacement.value.length);
        });
      });
      wrap.querySelectorAll('tbody tr').forEach(row => row.addEventListener('click', event => {
        if (!event.target.closest('a')) selectRestaurant(row.dataset.id);
      }));
    }

    Promise.all([
      fetch('cities.json').then(response => {
        if (!response.ok) throw new Error('Could not load cities.json');
        return response.json();
      }),
      fetch('data/nyc.json').then(response => {
        if (!response.ok) throw new Error('Could not load data/nyc.json');
        return response.json();
      }),
      fetch('build.json', { cache: 'no-store' }).then(response => {
        if (!response.ok) throw new Error('Could not load build.json');
        return response.json();
      })
    ]).then(([cities, data, build]) => {
      const city = cities.find(item => item.key === 'nyc');
      map.setView([city.lat, city.lng], city.zoom);
      restaurants = data;
      const latest = restaurants.reduce((value, item) => value > item.last_seen ? value : item.last_seen, '');
      const updated = latest ? new Date(latest).toLocaleDateString('en-GB', {
        day: '2-digit',
        month: 'short',
        year: '2-digit',
        timeZone: 'UTC'
      }).replace(/ /g, '-') : '';
      document.getElementById('status').innerHTML = `${restaurants.length} places${updated ? ` · Updated <a href="${escapeHtml(build.url)}" target="_blank" rel="noopener" title="View deployment run">${updated}</a>` : ''}`;
      render();
      map.on('moveend', render);
    }).catch(error => {
      console.error(error);
      document.getElementById('status').textContent = 'Unable to load data';
      document.getElementById('table-wrap').innerHTML = '<div class="empty">Restaurant data could not be loaded.</div>';
      map.setView([40.758, -73.9855], 14);
    });

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => navigator.serviceWorker.register('service-worker.js').catch(error => {
        console.error('Service worker registration failed', error);
      }));
    }
  </script>
</body>
</html>
