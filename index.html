<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Rick's Restaurant Finder</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🍴</text></svg>">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
  <style>
    :root {
      color-scheme: dark;
      --bg: #0b1120;
      --panel: #111827;
      --panel-soft: #1f2937;
      --line: #334155;
      --text: #e5e7eb;
      --muted: #94a3b8;
      --accent: #f59e0b;
      --blue: #60a5fa;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; background: var(--bg); color: var(--text); font: 14px/1.4 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    body { display: grid; grid-template-rows: auto minmax(260px, 55vh) 1fr; overflow: hidden; }
    header { display: flex; align-items: center; gap: 18px; min-height: 48px; padding: 8px 16px; border-bottom: 1px solid var(--line); background: var(--panel); }
    h1 { margin: 0; font-size: 16px; letter-spacing: .01em; }
    .status { margin-left: auto; color: var(--muted); font-size: 12px; text-align: right; }
    .github { color: var(--muted); text-decoration: none; font-weight: 700; }
    .github:hover { color: var(--text); }
    #map { width: 100%; height: 100%; }
    #table-wrap { overflow: auto; border-top: 1px solid var(--line); }
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    thead { position: sticky; top: 0; z-index: 2; background: var(--panel); }
    th { padding: 8px 10px; border-bottom: 2px solid var(--line); color: var(--muted); text-align: left; vertical-align: top; }
    td { max-width: 280px; padding: 8px 10px; border-bottom: 1px solid #1e293b; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    tbody tr { cursor: pointer; }
    tbody tr:hover, tbody tr.selected { background: var(--panel-soft); }
    a { color: var(--blue); }
    .reference { color: var(--accent); }
    .filter { position: relative; margin-top: 5px; }
    .filter input { width: 100%; min-width: 90px; padding: 5px 7px; border: 1px solid var(--line); border-radius: 5px; outline: none; background: var(--bg); color: var(--text); font: inherit; font-size: 11px; }
    .filter input:focus { border-color: var(--blue); }
    .empty { display: grid; min-height: 160px; place-items: center; padding: 24px; color: var(--muted); text-align: center; }
    .pin-label { padding: 2px 6px; border: 1px solid var(--line); border-radius: 4px; background: rgba(11,17,32,.9); color: var(--text); font-weight: 650; }
    @media (max-width: 700px) {
      body { grid-template-rows: auto minmax(230px, 48vh) 1fr; }
      header { gap: 8px; padding: 8px 10px; }
      h1 { font-size: 14px; }
      .status { font-size: 10px; }
      th, td { padding: 7px; }
      .phone-column { display: none; }
    }
  </style>
</head>
<body>
  <header>
    <h1>Rick's Restaurant Finder</h1>
    <span id="status" class="status">Loading…</span>
    <a class="github" href="https://github.com/pathikrit/restfinder" target="_blank" rel="noopener" aria-label="GitHub repository">GitHub</a>
  </header>
  <main id="map" aria-label="Restaurant map"></main>
  <section id="table-wrap" aria-live="polite"><div class="empty">Loading restaurants…</div></section>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
  <script>
    const filters = { name: '', cuisine: '', address: '', references: '' };
    const markers = new Map();
    let restaurants = [];

    const map = L.map('map');
    L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
      attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>'
    }).addTo(map);
    const markerLayer = L.layerGroup().addTo(map);
    const defaultIcon = L.icon({
      iconUrl: 'https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/images/marker-icon.png',
      shadowUrl: 'https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/images/marker-shadow.png',
      iconSize: [25, 41], iconAnchor: [12, 41], popupAnchor: [1, -34], shadowSize: [41, 41]
    });

    function escapeHtml(value) {
      return String(value == null ? '' : value).replace(/[&<>"']/g, character => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;'
      })[character]);
    }

    function referenceHtml(item) {
      const value = item.reference || '';
      try {
        const url = new URL(value);
        if (url.protocol === 'http:' || url.protocol === 'https:') {
          const label = url.hostname.replace(/^www\./, '');
          return `<a class="reference" href="${escapeHtml(url.href)}" target="_blank" rel="noopener">${escapeHtml(label)}</a>`;
        }
      } catch (_) {}
      return `<span class="reference">${escapeHtml(value)}</span>`;
    }

    function referencesHtml(items) {
      return (items || []).map(referenceHtml).join(', ');
    }

    function referenceSearchText(restaurant) {
      return (restaurant.references || []).map(item => item.reference || '').join(' ').toLowerCase();
    }

    function filteredRestaurants() {
      if (!restaurants.length) return [];
      const bounds = map.getBounds();
      return restaurants.filter(restaurant =>
        bounds.contains([restaurant.lat, restaurant.lon]) &&
        (!filters.name || (restaurant.name || '').toLowerCase().includes(filters.name)) &&
        (!filters.cuisine || (restaurant.cuisine || '').toLowerCase().includes(filters.cuisine)) &&
        (!filters.address || (restaurant.address || '').toLowerCase().includes(filters.address)) &&
        (!filters.references || referenceSearchText(restaurant).includes(filters.references))
      );
    }

    function filterInput(key) {
      return `<div class="filter"><input data-filter="${key}" value="${escapeHtml(filters[key])}" placeholder="Filter…" aria-label="Filter ${key}"></div>`;
    }

    function selectRestaurant(id) {
      document.querySelectorAll('tbody tr').forEach(row => row.classList.toggle('selected', row.dataset.id === id));
      const marker = markers.get(id);
      if (marker) {
        map.panTo(marker.getLatLng());
        marker.openPopup();
      }
    }

    function render() {
      const visible = filteredRestaurants();
      markerLayer.clearLayers();
      markers.clear();

      visible.forEach(restaurant => {
        const address = restaurant.address || '';
        const mapQuery = encodeURIComponent(`${restaurant.name}, ${address}`);
        const popup = [
          `<strong>${escapeHtml(restaurant.name)}</strong>`,
          restaurant.cuisine ? escapeHtml(restaurant.cuisine) : '',
          address ? `<a href="https://www.google.com/maps/search/${mapQuery}" target="_blank" rel="noopener">${escapeHtml(address)}</a>` : '',
          restaurant.phone ? `<a href="tel:${escapeHtml(restaurant.phone)}">${escapeHtml(restaurant.phone)}</a>` : '',
          referencesHtml(restaurant.references)
        ].filter(Boolean).join('<br>');
        const marker = L.marker([restaurant.lat, restaurant.lon], { icon: defaultIcon }).bindPopup(popup);
        if (visible.length <= 10) marker.bindTooltip(restaurant.name, { permanent: true, direction: 'top', className: 'pin-label' });
        marker.addTo(markerLayer);
        markers.set(restaurant.id, marker);
      });

      const wrap = document.getElementById('table-wrap');
      if (!restaurants.length) {
        wrap.innerHTML = '<div class="empty">No referenced restaurants have been published yet.</div>';
        return;
      }
      let html = `<table><thead><tr>
        <th>#</th>
        <th>Name${filterInput('name')}</th>
        <th>Cuisine${filterInput('cuisine')}</th>
        <th>Address${filterInput('address')}</th>
        <th class="phone-column">Phone</th>
        <th>References${filterInput('references')}</th>
      </tr></thead><tbody>`;
      visible.forEach((restaurant, index) => {
        const address = restaurant.address || '';
        const mapQuery = encodeURIComponent(`${restaurant.name}, ${address}`);
        html += `<tr data-id="${escapeHtml(restaurant.id)}">
          <td>${index + 1}</td>
          <td title="${escapeHtml(restaurant.name)}">${escapeHtml(restaurant.name)}</td>
          <td title="${escapeHtml(restaurant.cuisine || '')}">${escapeHtml(restaurant.cuisine || '')}</td>
          <td title="${escapeHtml(address)}">${address ? `<a href="https://www.google.com/maps/search/${mapQuery}" target="_blank" rel="noopener">${escapeHtml(address)}</a>` : ''}</td>
          <td class="phone-column">${restaurant.phone ? `<a href="tel:${escapeHtml(restaurant.phone)}">${escapeHtml(restaurant.phone)}</a>` : ''}</td>
          <td>${referencesHtml(restaurant.references)}</td>
        </tr>`;
      });
      wrap.innerHTML = `${html}</tbody></table>`;
      wrap.querySelectorAll('input[data-filter]').forEach(input => {
        input.addEventListener('input', event => {
          filters[event.target.dataset.filter] = event.target.value.trim().toLowerCase();
          render();
          const replacement = document.querySelector(`input[data-filter="${event.target.dataset.filter}"]`);
          replacement.focus();
          replacement.setSelectionRange(replacement.value.length, replacement.value.length);
        });
      });
      wrap.querySelectorAll('tbody tr').forEach(row => row.addEventListener('click', event => {
        if (!event.target.closest('a')) selectRestaurant(row.dataset.id);
      }));
    }

    Promise.all([
      fetch('cities.json').then(response => {
        if (!response.ok) throw new Error('Could not load cities.json');
        return response.json();
      }),
      fetch('data/nyc.json').then(response => {
        if (!response.ok) throw new Error('Could not load data/nyc.json');
        return response.json();
      })
    ]).then(([cities, data]) => {
      const city = cities.find(item => item.key === 'nyc');
      map.setView([city.lat, city.lng], city.zoom);
      restaurants = data;
      const latest = restaurants.reduce((value, item) => value > item.last_seen ? value : item.last_seen, '');
      document.getElementById('status').textContent = `${restaurants.length} curated places${latest ? ` · Updated ${new Date(latest).toLocaleDateString()}` : ''}`;
      render();
      map.on('moveend', render);
    }).catch(error => {
      console.error(error);
      document.getElementById('status').textContent = 'Unable to load data';
      document.getElementById('table-wrap').innerHTML = '<div class="empty">Restaurant data could not be loaded.</div>';
      map.setView([40.758, -73.9855], 14);
    });
  </script>
</body>
</html>
